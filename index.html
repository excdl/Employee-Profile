<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>強祐保全 - 人事與薪資管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-12">

    <!-- 🔐 密碼登入遮罩頁面 -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900 bg-opacity-90 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-200 text-center">
            <div class="text-4xl mb-3">🛡️</div>
            <h2 class="text-xl font-bold text-slate-900 mb-1">強祐保全｜人事管理系統</h2>
            <p class="text-xs text-slate-500 mb-6">請輸入授權登錄密碼以繼續操作</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">登錄密碼</label>
                    <input type="password" id="loginPassword" required placeholder="請輸入密碼..." 
                        class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div id="loginError" class="text-xs text-rose-600 font-medium hidden"></div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg shadow transition text-sm">
                    驗證登入
                </button>
            </form>
        </div>
    </div>

    <!-- 頂部導航列 -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <span class="text-xl">🛡️</span>
                <h1 class="text-base sm:text-xl font-bold tracking-wide">強祐保全｜人事管理</h1>
            </div>
            <!-- 新增員工按鈕（依權限動態顯示） -->
            <button id="navAddBtn" onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-3.5 py-1.5 rounded-lg shadow text-sm transition hidden items-center gap-1.5">
                <span>＋</span> 新增員工
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6">
        
        <!-- 統計摘要卡片（3 個並排） -->
        <div class="grid grid-cols-3 gap-2 sm:gap-4 mb-4 sm:mb-6">
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs text-slate-500 font-medium">總員工數</p>
                    <p id="statTotal" class="text-lg sm:text-2xl font-bold text-slate-800">0</p>
                </div>
                <div class="hidden sm:flex p-2.5 bg-blue-50 text-blue-600 rounded-lg text-sm">👥</div>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs text-slate-500 font-medium">線上在職</p>
                    <p id="statActive" class="text-lg sm:text-2xl font-bold text-emerald-600">0</p>
                </div>
                <div class="hidden sm:flex p-2.5 bg-emerald-50 text-emerald-600 rounded-lg text-sm">✅</div>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-[10px] sm:text-xs text-slate-500 font-medium">派駐案場數</p>
                    <p id="statSites" class="text-lg sm:text-2xl font-bold text-indigo-600">0</p>
                </div>
                <div class="hidden sm:flex p-2.5 bg-indigo-50 text-indigo-600 rounded-lg text-sm">🏢</div>
            </div>
        </div>

        <!-- 進階篩選與搜尋控制台 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 sm:mb-6">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">關鍵字搜尋</label>
                    <input type="text" id="searchKeyword" oninput="filterData()" placeholder="姓名、電話、身分證..." 
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">派駐案場</label>
                    <select id="filterSite" onchange="filterData()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">全部案場</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">在職狀態</label>
                    <select id="filterStatus" onchange="filterData()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="">全部狀態</option>
                        <option value="在職" selected>在職</option>
                        <option value="離職">離職</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="resetFilters()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium py-2 rounded-lg border border-slate-300 transition">
                        重設篩選條件
                    </button>
                </div>
            </div>
        </div>

        <!-- 員工清單容器 -->
        <div class="mb-4 flex justify-between items-center px-1">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">員工名單列表</h3>
            <span id="resultCount" class="text-xs text-slate-400">共 0 筆</span>
        </div>
        
        <!-- 員工清單容器 -->
        <div id="employeeContainer">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-slate-500">
                請先完成密碼登入以載入資料...
            </div>
        </div>
    </main>

    <!-- 員工詳細資料與編輯 Modal -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden flex items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-white rounded-2xl max-w-4xl w-full p-4 sm:p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b pb-3 gap-3">
                <h3 id="modalTitle" class="text-base sm:text-lg font-bold text-slate-900">員工詳細資料</h3>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                    <!-- 刪除按鈕（依權限動態顯示） -->
                    <button type="button" id="modalDeleteBtn" onclick="deleteEmployee()" class="px-3 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs font-medium transition hidden">刪除員工</button>
                    <!-- 編輯/儲存按鈕（依權限動態顯示） -->
                    <button type="button" id="editBtn" onclick="enableEditMode()" class="px-4 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded-lg text-xs font-medium transition hidden">編輯資料</button>
                    <button type="button" id="saveEditBtn" onclick="document.getElementById('editEmployeeForm').requestSubmit()" class="px-4 py-1.5 bg-emerald-600 text-white hover:bg-emerald-700 rounded-lg text-xs font-medium transition hidden">儲存變更</button>
                    <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-2">✕</button>
                </div>
            </div>
            
            <form id="editEmployeeForm" onsubmit="submitEditEmployee(event)">
                <input type="hidden" id="editRowIndex" name="rowIndex">
                <div id="modalContent" class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 text-sm">
                    <!-- 動態載入欄位或編輯表單 -->
                </div>
            </form>
        </div>
    </div>

    <!-- 新增員工表單 Modal -->
    <div id="addModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden flex items-center justify-center p-3 sm:p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-4 sm:p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-base sm:text-lg font-bold text-slate-900">新增保全人員資料</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-2">✕</button>
            </div>
            <form id="addEmployeeForm" onsubmit="submitNewEmployee(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600">服務單位</label>
                    <input type="text" name="服務單位" list="unitList" required class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                    <datalist id="unitList"></datalist>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">姓名</label>
                    <input type="text" name="姓名" required class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">目前派駐案場</label>
                    <input type="text" name="目前派駐案場" list="siteList" class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                    <datalist id="siteList"></datalist>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">職稱</label>
                    <input type="text" name="職稱" value="保全人員" list="titleList" class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                    <datalist id="titleList"></datalist>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">入職日期</label>
                    <input type="date" name="入職日期" class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">約定薪資</label>
                    <input type="number" name="約定薪資" class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">勞健保級距</label>
                    <input type="number" name="勞健保級距" class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">聯絡電話</label>
                    <input type="tel" name="聯絡電話" class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">身分證字號</label>
                    <input type="text" name="身分證字號" class="w-full mt-1 border border-slate-300 rounded-lg p-2 uppercase text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">在職狀態</label>
                    <select name="在職狀態" class="w-full mt-1 border border-slate-300 rounded-lg p-2 text-sm">
                        <option value="在職" selected>在職</option>
                        <option value="離職">離職</option>
                    </select>
                </div>
                <div class="sm:col-span-2 flex justify-end gap-3 mt-4 border-t pt-3">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50">取消</button>
                    <button type="submit" id="saveBtn" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">確認儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwmskSvlCc7OfFv_1p1fjWnXoujgcZlaNOEEtPa383Sw17qfEytZOwH9q7U8w3tfZ_daQ/exec"; 
        let allEmployees = [];
        let currentEditingEmp = null;
        let currentUserPermissions = { canAdd: false, canEdit: false, canDelete: false };

        const fieldConfigs = [
            { label: "服務單位", key: "服務單位" },
            { label: "姓名", key: "姓名" },
            { label: "目前派駐案場", key: "目前派駐案場" },
            { label: "職稱", key: "職稱" },
            { label: "入職日期", key: "入職日期", type: "date" },
            { label: "離職日期", key: "離職日期", type: "date" },
            { label: "在職狀態", key: "在職狀態", type: "select", options: ["在職", "離職"] },
            { label: "約定薪資", key: "約定薪資", type: "number" },
            { label: "薪資別", key: "薪資別", type: "select", options: ["月薪", "日薪", "時薪"] },
            { label: "聯絡電話", key: "聯絡電話", type: "tel" },
            { label: "身分證字號", key: "身分證字號" },
            { label: "出生年月日", key: "出生年月日", type: "date" },
            { label: "投保勞健保", key: "投保勞健保", type: "select", options: ["是", "否"] },
            { label: "勞健保級距", key: "勞健保級距", type: "number" },
            { label: "健保眷屬人數", key: "健保眷屬人數", type: "number" },
            { label: "投保團保", key: "投保團保", type: "select", options: ["是", "否"] },
            { label: "緊急聯絡人", key: "緊急聯絡人" },
            { label: "關係", key: "關係" },
            { label: "緊急聯絡人電話", key: "緊急聯絡人電話", type: "tel" },
            { label: "安調狀態", key: "安調" },
            { label: "是否有做安調", key: "是否有做安調", type: "select", options: ["是", "否"] },
            { label: "前科紀錄", key: "前科紀錄" },
            { label: "法院扣薪(法扣)", key: "法院扣薪(法扣)" },
            { label: "低收入戶身分", key: "低收入戶身分", type: "select", options: ["否", "是"] },
            { label: "報稅", key: "報稅" },
            { label: "通訊地址", key: "通訊地址", full: true },
            { label: "備註", key: "備註", full: true },
            { label: "其它", key: "其它", full: true }
        ];

        // 🔐 處理密碼登入驗證
        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById("loginPassword").value.trim();
            const loginBtn = document.getElementById("loginBtn");
            const errDiv = document.getElementById("loginError");

            loginBtn.disabled = true;
            loginBtn.innerText = "驗證中...";
            errDiv.classList.add("hidden");

            try {
                let res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ _action: "login", 密碼: password })
                });
                let result = await res.json();

                if (result.status === "success") {
                    // 記錄權限 (判斷是否為 "Y"，大小寫不拘)
                    currentUserPermissions = {
                        canAdd: String(result.permissions?.新增 || "").trim().toUpperCase() === "Y",
                        canEdit: String(result.permissions?.編輯 || "").trim().toUpperCase() === "Y",
                        canDelete: String(result.permissions?.刪除 || "").trim().toUpperCase() === "Y"
                    };

                    // 依權限顯示/隱藏頂部新增按鈕
                    if (currentUserPermissions.canAdd) {
                        document.getElementById("navAddBtn").classList.remove("hidden");
                        document.getElementById("navAddBtn").classList.add("flex");
                    }

                    // 隱藏登入遮罩，開始載入主資料
                    document.getElementById("loginScreen").classList.add("hidden");
                    fetchData();
                } else {
                    errDiv.innerText = result.message || "登入失敗：密碼錯誤或無權限";
                    errDiv.classList.remove("hidden");
                }
            } catch (err) {
                console.error(err);
                errDiv.innerText = "伺服器連線異常，請檢查 GAS 部署連結。";
                errDiv.classList.remove("hidden");
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "驗證登入";
            }
        }

        async function fetchData() {
            try {
                let response = await fetch(GAS_URL);
                allEmployees = await response.json();
                updateStatistics(allEmployees);
                updateSiteFilterOptions(allEmployees);
                updateDatalists(allEmployees);
                filterData();
            } catch (error) {
                console.error("資料載入失敗", error);
                document.getElementById("employeeContainer").innerHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-red-200 text-center text-red-500 font-medium">
                        無法讀取員工資料，請重新整理頁面。
                    </div>`;
            }
        }

        function updateStatistics(data) {
            document.getElementById("statTotal").innerText = data.length;
            const activeCount = data.filter(e => (e["在職狀態"] || "").trim() === "在職").length;
            document.getElementById("statActive").innerText = activeCount;
            
            const sites = new Set(data.map(e => e["目前派駐案場"]).filter(Boolean));
            document.getElementById("statSites").innerText = sites.size;
        }

        function updateSiteFilterOptions(data) {
            const sites = [...new Set(data.map(item => item["目前派駐案場"]).filter(Boolean))];
            const select = document.getElementById("filterSite");
            select.innerHTML = '<option value="">全部案場</option>' + sites.map(site => `<option value="${site}">${site}</option>`).join('');
        }

        function updateDatalists(data) {
            const units = [...new Set(data.map(item => item["服務單位"]).filter(Boolean))];
            const sites = [...new Set(data.map(item => item["目前派駐案場"]).filter(Boolean))];
            const titles = [...new Set(data.map(item => item["職稱"]).filter(Boolean))];

            document.getElementById("unitList").innerHTML = units.map(u => `<option value="${u}">`).join('');
            document.getElementById("siteList").innerHTML = sites.map(s => `<option value="${s}">`).join('');
            document.getElementById("titleList").innerHTML = titles.map(t => `<option value="${t}">`).join('');
        }

        function filterData() {
            const keyword = document.getElementById("searchKeyword").value.toLowerCase();
            const selectedSite = document.getElementById("filterSite").value;
            const selectedStatus = document.getElementById("filterStatus").value;

            const filtered = allEmployees.filter(emp => {
                const textMatch = Object.values(emp).some(val => String(val || "").toLowerCase().includes(keyword));
                const siteMatch = !selectedSite || emp["目前派駐案場"] === selectedSite;
                const statusMatch = !selectedStatus || (emp["在職狀態"] || "").trim() === selectedStatus;
                return textMatch && siteMatch && statusMatch;
            });

            renderView(filtered);
        }

        function resetFilters() {
            document.getElementById("searchKeyword").value = "";
            document.getElementById("filterSite").value = "";
            document.getElementById("filterStatus").value = "在職";
            filterData();
        }

        function renderView(data) {
            const container = document.getElementById("employeeContainer");
            document.getElementById("resultCount").innerText = `共 ${data.length} 筆`;
            
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center text-slate-400">
                        查無符合條件的員工記錄
                    </div>`;
                return;
            }

            let html = '';

            // 1. 電腦版條列式表格
            html += `
                <div class="hidden sm:block bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-sm font-bold text-slate-600 uppercase tracking-wider">
                                <th class="py-3.5 px-4">服務單位</th>
                                <th class="py-3.5 px-4">姓名</th>
                                <th class="py-3.5 px-4">目前派駐案場</th>
                                <th class="py-3.5 px-4">職稱</th>
                                <th class="py-3.5 px-4">聯絡電話</th>
                                <th class="py-3.5 px-4 text-right">約定薪資</th>
                                <th class="py-3.5 px-4 text-right">勞健保級距</th>
                                <th class="py-3.5 px-4 text-center">狀態</th>
                                <th class="py-3.5 px-4 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-base">
            `;

            data.forEach((emp) => {
                const originalIndex = allEmployees.findIndex(item => item === emp);
                const isActive = (emp["在職狀態"] || "").trim() === "在職";
                
                let rawSalary = emp["約定薪資"];
                let displaySalary = "-";
                if (rawSalary !== "" && rawSalary !== undefined && rawSalary !== null && rawSalary !== "-") {
                    let num = Number(rawSalary);
                    displaySalary = isNaN(num) ? rawSalary : "$" + num.toLocaleString();
                }

                let rawPhone = emp["聯絡電話"] || "-";
                let phoneHtml = `<span class="text-slate-900 font-mono text-lg font-bold">${rawPhone}</span>`;

                html += `
                    <tr class="hover:bg-slate-50 transition cursor-pointer" onclick="showDetail(${originalIndex})">
                        <td class="py-3.5 px-4 text-slate-500 font-medium">${emp["服務單位"] || "-"}</td>
                        <td class="py-3.5 px-4 font-bold text-slate-900">${emp["姓名"] || "未填寫"}</td>
                        <td class="py-3.5 px-4">
                            <span class="font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded text-sm">${emp["目前派駐案場"] || "未指派"}</span>
                        </td>
                        <td class="py-3.5 px-4 text-slate-600">${emp["職稱"] || "-"}</td>
                        <td class="py-3.5 px-4">${phoneHtml}</td>
                        <td class="py-3.5 px-4 text-right font-medium text-slate-900">${displaySalary}</td>
                        <td class="py-3.5 px-4 text-right text-slate-600">${emp["勞健保級距"] || "-"}</td>
                        <td class="py-3.5 px-4 text-center">
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${isActive ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                                ${emp["在職狀態"] || "未知"}
                            </span>
                        </td>
                        <td class="py-3.5 px-4 text-center" onclick="event.stopPropagation()">
                            <button onclick="showDetail(${originalIndex})" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition">
                                檢視 ➔
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            // 2. 手機版卡片檢視
            html += `<div class="sm:hidden grid grid-cols-1 gap-3.5">`;

            data.forEach((emp) => {
                const originalIndex = allEmployees.findIndex(item => item === emp);
                const isActive = (emp["在職狀態"] || "").trim() === "在職";
                
                let rawSalary = emp["約定薪資"];
                let displaySalary = "-";
                if (rawSalary !== "" && rawSalary !== undefined && rawSalary !== null && rawSalary !== "-") {
                    let num = Number(rawSalary);
                    displaySalary = isNaN(num) ? rawSalary : "$" + num.toLocaleString();
                }

                let rawPhone = emp["聯絡電話"] || "";
                let phoneHtml = "-";
                if (rawPhone) {
                    phoneHtml = `<a href="tel:${rawPhone}" class="text-blue-600 hover:underline font-mono text-lg font-bold">${rawPhone}</a>`;
                }

                html += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2.5">
                                <div>
                                    <h4 class="text-lg font-bold text-slate-900">${emp["姓名"] || "未填寫"}</h4>
                                    <p class="text-sm text-slate-500 font-medium">${emp["服務單位"] || "未填寫單位"}</p>
                                </div>
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isActive ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                                    ${emp["在職狀態"] || "未知"}
                                </span>
                            </div>

                            <div class="space-y-2 text-sm text-slate-600 border-t border-slate-100 pt-2.5 mb-3">
                                <div class="flex justify-between">
                                    <span class="text-slate-400">派駐案場：</span>
                                    <span class="font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">${emp["目前派駐案場"] || "未指派"}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">職稱：</span>
                                    <span class="font-medium text-slate-700">${emp["職稱"] || "-"}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-slate-400">聯絡電話：</span>
                                    <span>${phoneHtml}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">約定薪資：</span>
                                    <span class="font-medium text-slate-900">${displaySalary}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">勞健保級距：</span>
                                    <span class="font-medium text-slate-700">${emp["勞健保級距"] || "-"}</span>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 flex justify-end">
                            <button onclick="showDetail(${originalIndex})" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold py-2 rounded-lg transition text-center">
                                檢視完整檔案與編輯 ➔
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function showDetail(index) {
            currentEditingEmp = { ...allEmployees[index], _rowIndex: index + 2 }; 
            document.getElementById("editRowIndex").value = currentEditingEmp._rowIndex;
            document.getElementById("modalTitle").innerText = `${currentEditingEmp["姓名"]} - 完整人事與投保檔案`;
            
            renderDetailFields(false);
            
            // 依權限控制 Modal 內按鈕顯示
            const editBtn = document.getElementById("editBtn");
            const deleteBtn = document.getElementById("modalDeleteBtn");

            if (currentUserPermissions.canEdit) {
                editBtn.classList.remove("hidden");
            } else {
                editBtn.classList.add("hidden");
            }

            if (currentUserPermissions.canDelete) {
                deleteBtn.classList.remove("hidden");
            } else {
                deleteBtn.classList.add("hidden");
            }

            document.getElementById("saveEditBtn").classList.add("hidden");
            document.getElementById("detailModal").classList.remove("hidden");
        }

        function renderDetailFields(isEdit) {
            const modalContent = document.getElementById("modalContent");
            modalContent.innerHTML = fieldConfigs.map(f => {
                const val = currentEditingEmp[f.key] || "";
                if (isEdit) {
                    if (f.type === "select") {
                        const optionsHtml = f.options.map(opt => `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`).join('');
                        return `
                            <div class="${f.full ? 'sm:col-span-3' : ''} bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">${f.label}</label>
                                <select name="${f.key}" class="w-full border border-slate-300 rounded p-1.5 text-sm">${optionsHtml}</select>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="${f.full ? 'sm:col-span-3' : ''} bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                                <label class="block text-[11px] font-semibold text-slate-500 mb-1">${f.label}</label>
                                <input type="${f.type || 'text'}" name="${f.key}" value="${val}" class="w-full border border-slate-300 rounded p-1.5 text-sm">
                            </div>
                        `;
                    }
                } else {
                    return `
                        <div class="${f.full ? 'sm:col-span-3' : ''} bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                            <span class="block text-[11px] font-semibold text-slate-400 mb-0.5">${f.label}</span>
                            <span class="font-medium text-slate-800">${val || "無 / 未填寫"}</span>
                        </div>
                    `;
                }
            }).join('');
        }

        function enableEditMode() {
            renderDetailFields(true);
            document.getElementById("editBtn").classList.add("hidden");
            document.getElementById("saveEditBtn").classList.remove("hidden");
        }

        async function submitEditEmployee(e) {
            e.preventDefault();
            const form = document.getElementById("editEmployeeForm");
            const formData = new FormData(form);
            const dataObj = {};
            formData.forEach((value, key) => dataObj[key] = value);
            dataObj["_action"] = "update"; 

            const saveBtn = document.getElementById("saveEditBtn");
            const originalText = saveBtn.innerText;
            saveBtn.disabled = true;
            saveBtn.innerText = "儲存中...";

            try {
                let res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(dataObj)
                });
                let result = await res.json();
                if (result.status === "success") {
                    alert("員工資料已成功更新至 Google Sheets！");
                    closeModal();
                    fetchData();
                } else {
                    alert("更新失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("伺服器連線異常，請稍後再試。");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = originalText;
            }
        }

        async function deleteEmployee() {
            if (!currentEditingEmp) return;
            if (!confirm(`確定要刪除「${currentEditingEmp["姓名"]}」的完整人事記錄嗎？此動作無法復原。`)) return;

            try {
                let res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        _action: "delete",
                        身分證字號: currentEditingEmp["身分證字號"] || "",
                        姓名: currentEditingEmp["姓名"] || "",
                        聯絡電話: currentEditingEmp["聯絡電話"] || ""
                    })
                });
                let result = await res.json();
                if (result.status === "success") {
                    alert("該員工資料已成功刪除！");
                    closeModal();
                    fetchData();
                } else {
                    alert("刪除失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("伺服器連線異常，請稍後再試。");
            }
        }

        function closeModal() { document.getElementById("detailModal").classList.add("hidden"); }
        function openAddModal() { document.getElementById("addModal").classList.remove("hidden"); }
        function closeAddModal() { document.getElementById("addModal").classList.add("hidden"); }

        async function submitNewEmployee(e) {
            e.preventDefault();
            const form = document.getElementById("addEmployeeForm");
            const formData = new FormData(form);
            const dataObj = {};
            formData.forEach((value, key) => dataObj[key] = value);
            dataObj["_action"] = "create";

            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.innerText = "寫入中...";

            try {
                let res = await fetch(GAS (GAS_URL)); // 若需調整請維持 fetch(GAS_URL, ...)
                let resFetch = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(dataObj)
                });
                let result = await resFetch.json();
                if (result.status === "success") {
                    alert("新員工資料已成功寫入 Google Sheets！");
                    closeAddModal();
                    form.reset();
                    fetchData();
                } else {
                    alert("寫入失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("伺服器連線異常，請稍後再試。");
            } finally {
                btn.disabled = false;
                btn.innerText = "確認儲存";
            }
        }
    </script>
</body>
</html>
