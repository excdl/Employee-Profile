<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>強祐保全 - 人事與薪資管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

    <!-- 頂部手機/App 風格導航列 -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-bold tracking-wide">保全人員管理系統</h1>
            </div>
            <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded-lg text-sm transition flex items-center gap-1">
                <span>＋</span> 新增員工
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- 頂部標題與關鍵字搜尋 -->
        <div class="bg-slate-900 text-white p-5 rounded-2xl shadow-lg mb-6">
            <h2 class="text-lg font-bold mb-1">員工通訊錄</h2>
            <p class="text-xs text-slate-400 mb-4">人員查詢與案場管理</p>
            <div class="relative">
                <input type="text" id="searchKeyword" oninput="filterData()" placeholder="搜尋姓名、電話或案場..." 
                    class="w-full bg-slate-800 text-white placeholder-slate-400 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            
            <!-- 統計數字區塊 -->
            <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-slate-800">
                <div class="bg-slate-800/60 p-3 rounded-xl">
                    <p class="text-xs text-slate-400 font-medium">在職員工</p>
                    <p id="statActive" class="text-2xl font-bold text-emerald-400 mt-1">0 <span class="text-xs font-normal text-slate-400">人</span></p>
                </div>
                <div class="bg-slate-800/60 p-3 rounded-xl">
                    <p class="text-xs text-slate-400 font-medium">服務案場</p>
                    <p id="statSites" class="text-2xl font-bold text-indigo-400 mt-1">0 <span class="text-xs font-normal text-slate-400">個</span></p>
                </div>
            </div>
        </div>

        <!-- 功能選單區塊 -->
        <div class="mb-6">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">功能選單</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                <button onclick="filterByMenu('通訊錄')" class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 hover:shadow transition flex items-center gap-3 text-left">
                    <span class="p-2 bg-blue-50 text-blue-600 rounded-lg text-lg">👥</span>
                    <div>
                        <div class="text-sm font-bold text-slate-800">員工通訊錄</div>
                        <div class="text-xs text-slate-400">快速查詢與撥號</div>
                    </div>
                </button>
                <button onclick="filterByMenu('案場')" class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 hover:shadow transition flex items-center gap-3 text-left">
                    <span class="p-2 bg-indigo-50 text-indigo-600 rounded-lg text-lg">🏢</span>
                    <div>
                        <div class="text-sm font-bold text-slate-800">案場人員</div>
                        <div class="text-xs text-slate-400">各駐點配置狀況</div>
                    </div>
                </button>
                <button onclick="openAddModal()" class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 hover:shadow transition flex items-center gap-3 text-left">
                    <span class="p-2 bg-emerald-50 text-emerald-600 rounded-lg text-lg">➕</span>
                    <div>
                        <div class="text-sm font-bold text-slate-800">新增員工</div>
                        <div class="text-xs text-slate-400">建立新保全人員</div>
                    </div>
                </button>
                <button onclick="filterByMenu('人事')" class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 hover:shadow transition flex items-center gap-3 text-left">
                    <span class="p-2 bg-amber-50 text-amber-600 rounded-lg text-lg">📋</span>
                    <div>
                        <div class="text-sm font-bold text-slate-800">人事資料</div>
                        <div class="text-xs text-slate-400">薪資與勞健保級距</div>
                    </div>
                </button>
                <button onclick="filterByMenu('緊急聯絡')" class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 hover:shadow transition flex items-center gap-3 text-left">
                    <span class="p-2 bg-rose-50 text-rose-600 rounded-lg text-lg">☎️</span>
                    <div>
                        <div class="text-sm font-bold text-slate-800">緊急聯絡人</div>
                        <div class="text-xs text-slate-400">家屬與緊急對象</div>
                    </div>
                </button>
                <button onclick="showStatsModal()" class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:border-blue-500 hover:shadow transition flex items-center gap-3 text-left">
                    <span class="p-2 bg-purple-50 text-purple-600 rounded-lg text-lg">📊</span>
                    <div>
                        <div class="text-sm font-bold text-slate-800">人力統計</div>
                        <div class="text-xs text-slate-400">總覽與特況分析</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- 進階篩選工具列 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <select id="filterSite" onchange="filterData()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">全部案場</option>
                </select>
                <select id="filterStatus" onchange="filterData()" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">全部狀態</option>
                    <option value="在職" selected>在職</option>
                    <option value="離職">離職</option>
                </select>
            </div>
            <button onclick="resetFilters()" class="text-xs text-slate-500 hover:text-slate-700 underline">重設篩選</button>
        </div>

        <!-- 員工清單列表 -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
            <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-xs font-bold text-slate-600 uppercase tracking-wider">員工列表</h3>
                <span id="resultCount" class="text-xs text-slate-400">共 0 筆</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                            <th class="p-3.5">姓名 / 服務單位</th>
                            <th class="p-3.5">目前派駐案場 / 職稱</th>
                            <th class="p-3.5">聯絡電話</th>
                            <th class="p-3.5">約定薪資</th>
                            <th class="p-3.5">在職狀態</th>
                            <th class="p-3.5 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="6" class="p-6 text-center text-slate-500">正在與 Google Sheets 同步資料中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 員工詳細資料與編輯 Modal（完整 28 欄位） -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-4xl w-full p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900">員工詳細資料</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            </div>
            
            <form id="editEmployeeForm" onsubmit="submitEditEmployee(event)">
                <input type="hidden" id="editRowIndex" name="rowIndex">
                <div id="modalContent" class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
                    <!-- 動態載入完整 28 欄位或編輯表單 -->
                </div>
                <div id="modalActions" class="flex justify-between items-center mt-6 border-t pt-4">
                    <div>
                        <button type="button" onclick="deleteEmployee()" class="px-4 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-sm font-medium transition">刪除員工</button>
                    </div>
                    <div class="flex gap-3">
                        <button type="button" id="editBtn" onclick="enableEditMode()" class="px-5 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg text-sm font-medium transition">編輯資料</button>
                        <button type="submit" id="saveEditBtn" class="px-5 py-2 bg-emerald-600 text-white hover:bg-emerald-700 rounded-lg text-sm font-medium transition hidden">儲存變更</button>
                        <button type="button" onclick="closeModal()" class="px-5 py-2 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-lg text-sm font-medium transition">關閉</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- 人力統計摘要 Modal -->
    <div id="statsModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-900">📊 人力與特況統計總覽</h3>
                <button onclick="closeStatsModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-4 text-sm mb-4">
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                    <span class="block text-xs text-slate-500 font-medium">總員工數</span>
                    <span id="statTotal" class="text-xl font-bold text-slate-800">0</span>
                </div>
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                    <span class="block text-xs text-slate-500 font-medium">線上在職</span>
                    <span id="statActiveModal" class="text-xl font-bold text-emerald-600">0</span>
                </div>
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                    <span class="block text-xs text-slate-500 font-medium">派駐案場數</span>
                    <span id="statSitesModal" class="text-xl font-bold text-indigo-600">0</span>
                </div>
                <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                    <span class="block text-xs text-slate-500 font-medium">法扣 / 支援低收</span>
                    <span id="statSpecial" class="text-xl font-bold text-amber-600">0</span>
                </div>
            </div>
            <div class="flex justify-end pt-3 border-t">
                <button onclick="closeStatsModal()" class="px-5 py-2 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-lg text-sm font-medium">關閉</button>
            </div>
        </div>
    </div>

    <!-- 新增員工表單 Modal（精簡 10 欄位） -->
    <div id="addModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-900">新增保全人員資料</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            </div>
            <form id="addEmployeeForm" onsubmit="submitNewEmployee(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600">服務單位 *</label>
                    <input type="text" name="服務單位" required class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">姓名 *</label>
                    <input type="text" name="姓名" required class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">目前派駐案場</label>
                    <input type="text" name="目前派駐案場" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">職稱</label>
                    <input type="text" name="職稱" value="保全人員" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">入職日期</label>
                    <input type="date" name="入職日期" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">約定薪資</label>
                    <input type="number" name="約定薪資" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">勞健保級距</label>
                    <input type="number" name="勞健保級距" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">聯絡電話</label>
                    <input type="tel" name="聯絡電話" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">身分證字號</label>
                    <input type="text" name="身分證字號" class="w-full mt-1 border border-slate-300 rounded-lg p-2 uppercase">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600">在職狀態</label>
                    <select name="在職狀態" class="w-full mt-1 border border-slate-300 rounded-lg p-2">
                        <option value="在職" selected>在職</option>
                        <option value="離職">離職</option>
                    </select>
                </div>
                <div class="sm:col-span-2 flex justify-end gap-3 mt-4 border-t pt-3">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50">取消</button>
                    <button type="submit" id="saveBtn" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">確認儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyqbBIoRK6kKKg77hxu7ZqTNanEhcLJsH0zHyYhqGjuyO8tbs81Jaslzsp0kP-MmUE9OQ/exec"; // 請替換為您的 GAS 部署網址
        let allEmployees = [];
        let currentEditingEmp = null;

        // 28 個完整欄位設定，用於詳細資料與編輯
        const fieldConfigs = [
            { label: "服務單位", key: "服務單位" },
            { label: "姓名", key: "姓名" },
            { label: "目前派駐案場", key: "目前派駐案場" },
            { label: "職稱", key: "職稱" },
            { label: "入職日期", key: "入職日期", type: "date" },
            { label: "離職日期", key: "離職日期", type: "date" },
            { label: "在職狀態", key: "在職狀態", type: "select", options: ["在職", "離職"] },
            { label: "約定薪資", key: "約定薪資", type: "number" },
            { label: "薪資別", key: "薪資別", type: "select", options: ["月薪", "日薪", "時薪"] },
            { label: "聯絡電話", key: "聯絡電話", type: "tel" },
            { label: "身分證字號", key: "身分證字號" },
            { label: "出生年月日", key: "出生年月日", type: "date" },
            { label: "投保勞健保", key: "投保勞健保", type: "select", options: ["是", "否"] },
            { label: "勞健保級距", key: "勞健保級距", type: "number" },
            { label: "健保眷屬人數", key: "健保眷屬人數", type: "number" },
            { label: "投保團保", key: "投保團保", type: "select", options: ["是", "否"] },
            { label: "緊急聯絡人", key: "緊急聯絡人" },
            { label: "關係", key: "關係" },
            { label: "緊急聯絡人電話", key: "緊急聯絡人電話", type: "tel" },
            { label: "安調狀態", key: "安調" },
            { label: "是否有做安調", key: "是否有做安調", type: "select", options: ["是", "否"] },
            { label: "前科紀錄", key: "前科紀錄" },
            { label: "法院扣薪(法扣)", key: "法院扣薪(法扣)" },
            { label: "低收入戶身分", key: "低收入戶身分", type: "select", options: ["否", "是"] },
            { label: "報稅", key: "報稅" },
            { label: "通訊地址", key: "通訊地址", full: true },
            { label: "備註", key: "備註", full: true },
            { label: "其它", key: "其它", full: true }
        ];

        window.onload = function() {
            fetchData();
        };

        async function fetchData() {
            try {
                let response = await fetch(GAS_URL);
                allEmployees = await response.json();
                updateStatistics(allEmployees);
                updateSiteFilterOptions(allEmployees);
                filterData();
            } catch (error) {
                console.error("資料載入失敗", error);
                document.getElementById("employeeTableBody").innerHTML = `<tr><td colspan="6" class="p-6 text-center text-red-500 font-medium">無法讀取資料，請檢查 GAS 部署連結是否正確。</td></tr>`;
            }
        }

        function updateStatistics(data) {
            document.getElementById("statTotal").innerText = data.length;
            const activeCount = data.filter(e => (e["在職狀態"] || "").trim() === "在職").length;
            document.getElementById("statActive").innerText = activeCount;
            document.getElementById("statActiveModal").innerText = activeCount;
            
            const sites = new Set(data.map(e => e["目前派駐案場"]).filter(Boolean));
            document.getElementById("statSites").innerText = sites.size;
            document.getElementById("statSitesModal").innerText = sites.size;
            
            const specialCount = data.filter(e => (e["法院扣薪(法扣)"] && e["法院扣薪(法扣)"] !== "無") || (e["低收入戶身分"] && e["低收入戶身分"] !== "否")).length;
            document.getElementById("statSpecial").innerText = specialCount;
        }

        function updateSiteFilterOptions(data) {
            const sites = [...new Set(data.map(item => item["目前派駐案場"]).filter(Boolean))];
            const select = document.getElementById("filterSite");
            select.innerHTML = '<option value="">全部案場</option>' + sites.map(site => `<option value="${site}">${site}</option>`).join('');
        }

        function filterData() {
            const keyword = document.getElementById("searchKeyword").value.toLowerCase();
            const selectedSite = document.getElementById("filterSite").value;
            const selectedStatus = document.getElementById("filterStatus").value;

            const filtered = allEmployees.filter(emp => {
                const textMatch = Object.values(emp).some(val => String(val || "").toLowerCase().includes(keyword));
                const siteMatch = !selectedSite || emp["目前派駐案場"] === selectedSite;
                const statusMatch = !selectedStatus || (emp["在職狀態"] || "").trim() === selectedStatus;
                return textMatch && siteMatch && statusMatch;
            });

            renderTable(filtered);
        }

        function filterByMenu(type) {
            if (type === '通訊錄') {
                resetFilters();
            } else if (type === '案場') {
                document.getElementById("searchKeyword").value = "";
                document.getElementById("filterStatus").value = "";
                filterData();
            } else if (type === '人事') {
                document.getElementById("searchKeyword").value = "";
                document.getElementById("filterStatus").value = "在職";
                filterData();
            } else if (type === '緊急聯絡') {
                document.getElementById("searchKeyword").value = "緊急";
                filterData();
            }
        }

        function resetFilters() {
            document.getElementById("searchKeyword").value = "";
            document.getElementById("filterSite").value = "";
            document.getElementById("filterStatus").value = "在職";
            filterData();
        }

        function renderTable(data) {
            const tbody = document.getElementById("employeeTableBody");
            document.getElementById("resultCount").innerText = `共 ${data.length} 筆`;
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">查無符合條件的員工記錄</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((emp) => {
                const originalIndex = allEmployees.findIndex(item => item === emp);
                return `
                    <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                        <td class="p-3.5">
                            <div class="font-bold text-slate-900">${emp["姓名"] || "未填寫"}</div>
                            <div class="text-xs text-slate-500">${emp["服務單位"] || ""}</div>
                        </td>
                        <td class="p-3.5">
                            <span class="inline-block bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-xs font-semibold mb-1">${emp["目前派駐案場"] || "未指派案場"}</span>
                            <div class="text-xs text-slate-500">${emp["職稱"] || ""}</div>
                        </td>
                        <td class="p-3.5 text-slate-700">${emp["聯絡電話"] || "-"}</td>
                        <td class="p-3.5 font-medium text-slate-900">${emp["約定薪資"] ? Number(emp["約定薪資"]).toLocaleString() : "-"}</td>
                        <td class="p-3.5">
                            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${emp["在職狀態"] === '在職' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                                ${emp["在職狀態"] || "未知"}
                            </span>
                        </td>
                        <td class="p-3.5 text-center">
                            <button onclick='showDetail(${originalIndex})' class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-lg transition">
                                詳細檔案
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function showDetail(index) {
            currentEditingEmp = { ...allEmployees[index], _rowIndex: index + 2 }; // Google Sheets 從第 2 列開始（第 1 列為標題）
            document.getElementById("editRowIndex").value = currentEditingEmp._rowIndex;
            document.getElementById("modalTitle").innerText = `${currentEditingEmp["姓名"]} - 完整人事與投保檔案`;
            
            renderDetailFields(false);
            
            document.getElementById("editBtn").classList.remove("hidden");
            document.getElementById("saveEditBtn").classList.add("hidden");
            document.getElementById("detailModal").classList.remove("hidden");
        }

        function renderDetailFields(isEdit) {
            const modalContent = document.getElementById("modalContent");
            modalContent.innerHTML = fieldConfigs.map(f => {
                const val = currentEditingEmp[f.key] || "";
                if (isEdit) {
                    if (f.type === "select") {
                        const optionsHtml = f.options.map(opt => `<option value="${opt}" ${val === opt ? 'selected' : ''}>${opt}</option>`).join('');
                        return `
                            <div class="${f.full ? 'sm:col-span-3' : ''} bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <label class="block text-xs font-semibold text-slate-500 mb-1">${f.label}</label>
                                <select name="${f.key}" class="w-full border border-slate-300 rounded p-1.5 text-sm">${optionsHtml}</select>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="${f.full ? 'sm:col-span-3' : ''} bg-slate-50 p-3 rounded-lg border border-slate-200">
                                <label class="block text-xs font-semibold text-slate-500 mb-1">${f.label}</label>
                                <input type="${f.type || 'text'}" name="${f.key}" value="${val}" class="w-full border border-slate-300 rounded p-1.5 text-sm">
                            </div>
                        `;
                    }
                } else {
                    return `
                        <div class="${f.full ? 'sm:col-span-3' : ''} bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <span class="block text-xs font-semibold text-slate-400 mb-0.5">${f.label}</span>
                            <span class="font-medium text-slate-800">${val || "無 / 未填寫"}</span>
                        </div>
                    `;
                }
            }).join('');
        }

        function enableEditMode() {
            renderDetailFields(true);
            document.getElementById("editBtn").classList.add("hidden");
            document.getElementById("saveEditBtn").classList.remove("hidden");
        }

        async function submitEditEmployee(e) {
            e.preventDefault();
            const form = document.getElementById("editEmployeeForm");
            const formData = new FormData(form);
            const dataObj = {};
            formData.forEach((value, key) => dataObj[key] = value);
            dataObj["_action"] = "update"; // 識別為更新指令

            const saveBtn = document.getElementById("saveEditBtn");
            saveBtn.disabled = true;
            saveBtn.innerText = "儲存中...";

            try {
                let res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(dataObj)
                });
                let result = await res.json();
                if (result.status === "success") {
                    alert("員工資料已成功更新至 Google Sheets！");
                    closeModal();
                    fetchData();
                } else {
                    alert("更新失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("伺服器連線異常，請稍後再試。");
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "儲存變更";
            }
        }

        async function deleteEmployee() {
            if (!currentEditingEmp) return;
            if (!confirm(`確定要刪除「${currentEditingEmp["姓名"]}」的完整人事記錄嗎？此動作無法復原。`)) return;

            try {
                let res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        _action: "delete",
                        rowIndex: currentEditingEmp._rowIndex,
                        姓名: currentEditingEmp["姓名"]
                    })
                });
                let result = await res.json();
                if (result.status === "success") {
                    alert("該員工資料已成功刪除！");
                    closeModal();
                    fetchData();
                } else {
                    alert("刪除失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("伺服器連線異常，請稍後再試。");
            }
        }

        function closeModal() { document.getElementById("detailModal").classList.add("hidden"); }
        function openAddModal() { document.getElementById("addModal").classList.remove("hidden"); }
        function closeAddModal() { document.getElementById("addModal").classList.add("hidden"); }
        function showStatsModal() { document.getElementById("statsModal").classList.remove("hidden"); }
        function closeStatsModal() { document.getElementById("statsModal").classList.add("hidden"); }

        async function submitNewEmployee(e) {
            e.preventDefault();
            const form = document.getElementById("addEmployeeForm");
            const formData = new FormData(form);
            const dataObj = {};
            formData.forEach((value, key) => dataObj[key] = value);
            dataObj["_action"] = "create";

            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.innerText = "寫入中...";

            try {
                let res = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(dataObj)
                });
                let result = await res.json();
                if (result.status === "success") {
                    alert("新員工資料已成功寫入 Google Sheets！");
                    closeAddModal();
                    form.reset();
                    fetchData();
                } else {
                    alert("寫入失敗：" + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("伺服器連線異常，請稍後再試。");
            } finally {
                btn.disabled = false;
                btn.innerText = "確認儲存";
            }
        }
    </script>
</body>
</html>
